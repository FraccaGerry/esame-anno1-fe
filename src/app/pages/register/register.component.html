<div class="container mt-5">
  <div class="row">
    <div class="col col-lg-4"></div>

    <div class="col col-lg-4 col-md-12 border rounded p-4">
      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="form-outline mb-3">
          <label class="form-label">Nome</label>
          <input class="form-control" type="text" formControlName="firstName">
        </div>

        <div class="form-outline mb-3">
          <label class="form-label">Cognome</label>
          <input class="form-control" type="text" formControlName="lastName">
        </div>

        <div class="form-outline mb-3">
          <label class="form-label">URL immagine profilo</label>
          <input class="form-control" type="text" formControlName="picture">
        </div>

        <div class="form-outline mb-3">
          <label class="form-label">Ruolo</label>
          <select class="form-select" formControlName="role">
            <option value="student">Studente</option>
            <option value="teacher">Docente</option>
          </select>
        </div>

        <div class="form-outline mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" formControlName="username">
        </div>

        <div class="form-outline mb-4">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" formControlName="password">
        </div>

        <div class="text-danger">
          {{ errorMessage() }}
        </div>

        <div class="text-center">
          <button
            [disabled]="registerForm.invalid"
            type="submit"
            class="btn btn-primary btn-block mb-4">Registrati</button>
        </div>
        <div class="text-center">
          Hai già un account? <a routerLink="/login">Accedi</a>
        </div>
      </form>
    </div>
  </div>
</div>
