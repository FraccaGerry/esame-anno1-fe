<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Le mie classi</h2>
    @if (isTeacher()) {
      <button class="btn btn-primary" (click)="openCreate()">+ Nuova classe</button>
    }
  </div>

  <div class="list-group">
    @for (classroom of classrooms$ | async; track classroom.id) {
      <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
         role="button"
         (click)="navigateToDetail(classroom.id)">
        <div>
          <h5 class="mb-1">{{ classroom.name }}</h5>
          <small class="text-muted">Docente: {{ classroom.createdBy.fullName }}</small>
        </div>
        <div class="d-flex align-items-center gap-3">
          <span class="badge rounded-pill bg-primary-subtle text-primary-emphasis">
            {{ classroom.studentsCount }} {{ classroom.studentsCount === 1 ? 'studente' : 'studenti' }}
          </span>
          <span class="text-muted fs-4 lh-1">›</span>
        </div>
      </a>
    } @empty {
      <div class="text-center text-muted py-5">Nessuna classe.</div>
    }
  </div>
</div>
