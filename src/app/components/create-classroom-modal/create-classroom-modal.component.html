<div class="modal-header">
  <h4 class="modal-title">Nuova classe</h4>
  <button type="button" class="btn-close" aria-label="Chiudi" (click)="activeModal.dismiss()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="create()">
  <div class="modal-body">
    <div class="mb-3">
      <label class="form-label" for="classroom-name">Nome della classe</label>
      <input id="classroom-name" class="form-control" type="text" formControlName="name">
    </div>

    <div class="mb-3">
      <label class="form-label">Studenti</label>
      <div class="border rounded p-2 overflow-y-auto" style="max-height: 14rem;">
        @for (student of students$ | async; track student.id) {
          <div class="form-check py-1">
            <input
              class="form-check-input"
              type="checkbox"
              [id]="'student-' + student.id"
              [checked]="isSelected(student.id)"
              (change)="toggleStudent(student.id, $any($event.target).checked)">
            <label class="form-check-label" [attr.for]="'student-' + student.id">
              {{ student.fullName }}
            </label>
          </div>
        } @empty {
          <div class="text-muted">Nessuno studente registrato.</div>
        }
      </div>
      <div class="form-text">Gli studenti non potranno essere modificati dopo la creazione.</div>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger py-2 mb-0">{{ errorMessage() }}</div>
    }
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Annulla</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Crea</button>
  </div>
</form>
